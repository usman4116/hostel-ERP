<!-- Custom CSS is already loaded by settings.py (custom_css) -->

<!-- Quick Stats Row -->
<div class="row">
    <div class="col-12 col-sm-6 col-md-3">
        <div class="stat-box bg-gradient-primary">
            <div class="inner">
                <h3>{{ total_rooms }}</h3>
                <p>Total Rooms</p>
            </div>
            <div class="icon">
                <i class="fas fa-door-open"></i>
            </div>
        </div>
    </div>
    
    <div class="col-12 col-sm-6 col-md-3">
        <div class="stat-box bg-gradient-success">
            <div class="inner">
                <h3>{{ occupied_rooms }}</h3>
                <p>Occupied Rooms</p>
            </div>
            <div class="icon">
                <i class="fas fa-bed"></i>
            </div>
        </div>
    </div>
    
    <div class="col-12 col-sm-6 col-md-3">
        <div class="stat-box bg-gradient-info">
            <div class="inner">
                <h3>PKR {{ total_revenue }}</h3>
                <p>Revenue Collected</p>
            </div>
            <div class="icon">
                <i class="fas fa-wallet"></i>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
        <div class="stat-box bg-gradient-warning">
            <div class="inner">
                <h3>PKR {{ pending_revenue }}</h3>
                <p>Pending Dues</p>
            </div>
            <div class="icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row -->
<div class="row mt-2 mb-5">
    <div class="col-12 col-lg-6 mb-4">
        <div class="premium-card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title text-white m-0"><i class="fas fa-chart-pie mr-2 text-info"></i> Room Occupancy</h3>
            </div>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 250px;">
                <div style="width: 100%; max-width: 320px;">
                    <canvas id="occupancyAdminChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-lg-6 mb-4">
        <div class="premium-card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title text-white m-0"><i class="fas fa-chart-bar mr-2 text-warning"></i> Voucher Status</h3>
            </div>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 250px;">
                <div style="width: 100%; max-width: 400px;">
                    <canvas id="voucherAdminChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const occupiedRooms = parseInt("{{ occupied_rooms }}") || 0;
    const vacantRooms = parseInt("{{ vacant_rooms }}") || 0;
    
    const paidVouchers = parseInt("{{ paid_vouchers }}") || 0;
    const unpaidVouchers = parseInt("{{ unpaid_vouchers }}") || 0;

    // We make charts text white since we are in a dark theme
    Chart.defaults.color = 'rgba(255,255,255,0.7)';
    Chart.defaults.font.family = "'Inter', sans-serif";

    const ctxOccupancy = document.getElementById('occupancyAdminChart').getContext('2d');
    new Chart(ctxOccupancy, {
        type: 'doughnut',
        data: {
            labels: (occupiedRooms === 0 && vacantRooms === 0) ? ['No Data'] : ['Occupied', 'Vacant'],
            datasets: [{
                data: (occupiedRooms === 0 && vacantRooms === 0) ? [1] : [occupiedRooms, vacantRooms],
                backgroundColor: (occupiedRooms === 0 && vacantRooms === 0) ? ['rgba(255,255,255,0.05)'] : ['rgba(54, 162, 235, 0.8)', 'rgba(75, 192, 192, 0.8)'],
                borderColor: (occupiedRooms === 0 && vacantRooms === 0) ? ['rgba(255,255,255,0.1)'] : ['rgba(54, 162, 235, 1)', 'rgba(75, 192, 192, 1)'],
                borderWidth: 1,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            cutout: '65%',
            plugins: { 
                legend: { position: 'bottom', labels: { padding: 20 } } 
            }
        }
    });

    const ctxVoucher = document.getElementById('voucherAdminChart').getContext('2d');
    new Chart(ctxVoucher, {
        type: 'bar',
        data: {
            labels: ['Paid', 'Unpaid'],
            datasets: [{
                label: 'Vouchers',
                data: [paidVouchers, unpaidVouchers],
                backgroundColor: ['rgba(75, 192, 192, 0.8)', 'rgba(255, 99, 132, 0.8)'],
                borderColor: ['rgba(75, 192, 192, 1)', 'rgba(255, 99, 132, 1)'],
                borderWidth: 1,
                borderRadius: 6,
                barPercentage: 0.6
            }]
        },
        options: {
            responsive: true,
            scales: { 
                y: { 
                    beginAtZero: true, 
                    ticks: { stepSize: 1 },
                    grid: { color: 'rgba(255,255,255,0.1)' }
                },
                x: {
                    grid: { display: false }
                }
            },
            plugins: { legend: { display: false } }
        }
    });
});
</script>
